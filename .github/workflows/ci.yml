# Tests on every push and pull request; on a version tag (v0.1.0) it also builds the
# Linux probe and the Windows installer and keeps them as workflow artifacts.
# No secrets: nothing is signed or published.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo test --workspace --locked

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The desktop app needs WebKitGTK to compile on Linux and only ships on Windows.
      - run: cargo test --workspace --exclude colony-app --locked

  # Static (musl) Linux builds that "Set up Colony" copies into WSL distros.
  linux-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          # TODO: aarch64 (WSL on ARM) needs a cross linker, e.g. cargo-zigbuild.
          cargo build --release --locked --target x86_64-unknown-linux-musl -p colony-probe -p colony-hook
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/colony-probe target/x86_64-unknown-linux-musl/release/colony-hook dist/
          file dist/colony-probe
      - uses: actions/upload-artifact@v4
        with:
          name: colony-linux-x86_64
          path: dist/*

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(awk '/^\[workspace.package\]/{f=1} f && /^version/{gsub(/^[^"]*"|".*$/,""); print; exit}' Cargo.toml)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $v"; exit 1; }
          t=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' app/src-tauri/tauri.conf.json | head -1)
          [ "$t" = "$v" ] || { echo "tauri.conf.json version $t doesn't match $v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: colony-linux-x86_64
          path: linux
      - run: ./scripts/build-installer.ps1 -LinuxDir linux
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: colony-installer
          path: target/release/bundle/nsis/*.exe
