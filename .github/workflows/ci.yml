# Tests on every push and pull request; on a version tag (v0.1.0) it also builds the
# Linux probe and the Windows installer, then publishes a GitHub Release with the
# installer, its updater signature (.sig) and latest.json (what installed apps poll).
# Secrets (repository secrets): TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the updater artifacts. The installer itself
# is not code-signed. GITHUB_TOKEN creates the release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # whisper-rs (dictation) generates its bindings with bindgen, which needs libclang.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm test
        working-directory: app
      - run: cargo test --workspace --locked

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml, tauri.conf.json, package.json and Cargo.lock must agree, so a tag can't fail late.
      - run: scripts/check-release-version.sh
      # The desktop app needs WebKitGTK to compile on Linux and only ships on Windows.
      - run: cargo test --workspace --exclude colony-app --locked

  # Static (musl) Linux builds that "Set up Colony" copies into WSL distros.
  linux-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          # TODO: aarch64 (WSL on ARM) needs a cross linker, e.g. cargo-zigbuild.
          cargo build --release --locked --target x86_64-unknown-linux-musl -p colony-probe -p colony-hook
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/colony-probe target/x86_64-unknown-linux-musl/release/colony-hook dist/
          file dist/colony-probe
      - uses: actions/upload-artifact@v4
        with:
          name: colony-linux-x86_64
          path: dist/*

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version and the changelog
        shell: bash
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: colony-linux-x86_64
          path: linux
      - run: ./scripts/build-installer.ps1 -LinuxDir linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: colony-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: colony-installer
          path: installer
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Space-free names, so the URL in latest.json is exactly the asset's URL.
          exe="colony-command_${version}_x64-setup.exe"
          mv installer/*-setup.exe "$exe"
          mv installer/*-setup.exe.sig "$exe.sig"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${exe}"
          jq -n --arg v "$version" --arg url "$url" --rawfile sig "$exe.sig" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: ("Colony Command " + $v), pub_date: $date, platforms: {"windows-x86_64": {signature: ($sig | rtrimstr("\n")), url: $url}}}' > latest.json
          # Release notes: this version's section of CHANGELOG.md (the tag check guarantees it exists).
          awk -v h="## [$version]" 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "empty changelog section for $version"; exit 1; }
          jq --rawfile n notes.md '.notes = $n' latest.json > latest.tmp && mv latest.tmp latest.json
          cat latest.json
          gh release create "$GITHUB_REF_NAME" "$exe" "$exe.sig" latest.json --title "Colony Command $version" --notes-file notes.md
