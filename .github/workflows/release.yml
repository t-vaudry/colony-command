# Cuts a patch release (0.1.1 -> 0.1.2) once main has been quiet for 20 minutes.
# Nothing waits on a runner: the check runs hourly and whenever CI finishes on main,
# releases if main's head is at least 20 minutes old and CI passed on it, and
# otherwise exits in seconds. A burst of merges therefore becomes one release.
# "Run workflow" on this workflow releases now, skipping the quiet period.
#
# The release itself: run scripts/bump-patch.sh (version files, CHANGELOG.md),
# commit "Release X.Y.Z" to main, tag vX.Y.Z, then start ci.yml on the tag, which
# builds and publishes. It has to be started explicitly: pushes made with
# GITHUB_TOKEN don't trigger workflows (that is also why the release commit doesn't
# start CI, and so this workflow, again).
name: Release

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is least delayed.
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut:
    # From workflow_run, only a passing CI run from a push to main counts (not the
    # tag build this workflow starts, nor a pull request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Never interrupt a release halfway; one at a time.
    concurrency:
      group: release-cut
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUIET_SECONDS: 1200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Anything new, quiet, and passing CI?
        id: check
        run: |
          go() { echo "go=$1" >>"$GITHUB_OUTPUT"; exit 0; }
          last=$(git describe --tags --abbrev=0 --match 'v*')
          n=$(git rev-list --count "$last..HEAD")
          echo "$n commit(s) on main since $last"
          [ "$n" -gt 0 ] || go false

          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct HEAD) ))
            echo "main's head is ${age}s old"
            [ "$age" -ge "$QUIET_SECONDS" ] || { echo "not quiet yet; a later run releases"; go false; }
          fi

          sha=$(git rev-parse HEAD)
          run=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty')
          [ -n "$run" ] || { echo "no CI run found for $sha; not releasing"; go false; }
          id=$(jq -r .databaseId <<<"$run")
          if [ "$(jq -r .status <<<"$run")" != completed ]; then
            # Started by hand: wait for it. Otherwise CI finishing triggers this again.
            [ "${{ github.event_name }}" = workflow_dispatch ] || { echo "CI run $id still going; its completion triggers a release check"; go false; }
            gh run watch "$id" --interval 30 >/dev/null || true
            run=$(gh run view "$id" --json conclusion)
          fi
          [ "$(jq -r .conclusion <<<"$run")" = success ] || { echo "CI run $id did not pass on $sha; not releasing"; go false; }
          echo "CI passed: run $id"
          go true

      - name: Bump, commit and tag
        if: steps.check.outputs.go == 'true'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v=$(scripts/bump-patch.sh)
          git commit -qam "Release $v"
          git tag "v$v"
          # Atomic: if main moved meanwhile, nothing is pushed (a later run picks it up).
          git push --atomic origin HEAD:main "v$v"
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.check.outputs.go == 'true'
        run: |
          gh workflow run ci.yml --ref "v${{ steps.bump.outputs.version }}"
          echo "Started ci.yml on v${{ steps.bump.outputs.version }}"
