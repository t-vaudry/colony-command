# Cuts a patch release (0.1.1 -> 0.1.2) once main has been quiet for 20 minutes.
# Every push to main restarts the wait, so a burst of merges becomes one release.
# "Run workflow" on this workflow releases now, skipping the wait.
#
# The release itself: wait for CI on main's head to pass, run scripts/bump-patch.sh
# (version files, CHANGELOG.md), commit "Release X.Y.Z" to main, tag vX.Y.Z, then
# start ci.yml on the tag, which builds and publishes. It has to be started
# explicitly: pushes made with GITHUB_TOKEN don't trigger workflows (that is also
# why the release commit doesn't start another round of this one).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A newer push cancels this wait and starts its own.
    concurrency:
      group: release-quiet
      cancel-in-progress: true
    steps:
      - run: sleep 1200

  cut:
    needs: quiet
    # Runs after a wait that finished, or straight away when started by hand.
    if: always() && (needs.quiet.result == 'success' || needs.quiet.result == 'skipped')
    runs-on: ubuntu-latest
    # Never interrupt a release halfway; one at a time.
    concurrency:
      group: release-cut
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Anything new since the last release?
        id: check
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*')
          n=$(git rev-list --count "$last..HEAD")
          echo "$n commit(s) on main since $last"
          echo "go=$([ "$n" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Wait for CI to pass on main
        if: steps.check.outputs.go == 'true'
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 20
          done
          [ -n "$id" ] || { echo "no CI run found for $sha"; exit 1; }
          gh run watch "$id" --interval 30 --exit-status >/dev/null || { echo "CI failed on $sha; not releasing"; exit 1; }
          echo "CI passed: run $id"

      - name: Bump, commit and tag
        if: steps.check.outputs.go == 'true'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v=$(scripts/bump-patch.sh)
          git commit -qam "Release $v"
          git tag "v$v"
          # Atomic: if main moved meanwhile, nothing is pushed (that push starts its own round).
          git push --atomic origin HEAD:main "v$v"
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.check.outputs.go == 'true'
        run: |
          gh workflow run ci.yml --ref "v${{ steps.bump.outputs.version }}"
          echo "Started ci.yml on v${{ steps.bump.outputs.version }}"
