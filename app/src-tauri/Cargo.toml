[package]
name = "colony-app"
description = "Colony Command desktop app: the map in a window, with the daemon started on demand."
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds the app so the Android shell can load it; the bin is the desktop entry point.
[lib]
name = "colony_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "colony-command"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-opener = "2"

# Everything that needs a PC: the tray, the daemon, installer hooks, WSL setup, updates.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
colony-source = { path = "../../crates/colony-source" }
colony-setup = { path = "../../crates/colony-setup" }
colony-core.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[features]
# Embed the built frontend instead of loading the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
