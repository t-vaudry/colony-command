[package]
name = "colony-ptyd"
description = "Owns Colony's terminals so the sessions in them survive colonyd restarts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
colony-core.workspace = true
colony-source.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
