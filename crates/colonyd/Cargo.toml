[package]
name = "colonyd"
description = "Colony Command daemon: gathers events from Windows and WSL, keeps colony state, serves the map."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
colony-core.workspace = true
colony-source.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
uuid.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
# Same version tokio already uses; PTY crates are avoided because Smart App
# Control blocks their build scripts.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
